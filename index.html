<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101214" />
    <title>TACTA</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101214;
        color: #f3f6f8;
      }

      main {
        width: min(760px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: #aab5bf;
        line-height: 1.45;
      }

      nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      a {
        min-height: 42px;
        display: inline-grid;
        place-items: center;
        border: 1px solid #35404a;
        border-radius: 6px;
        background: #20262d;
        color: #f3f6f8;
        padding: 0 14px;
        text-decoration: none;
      }

      a:hover {
        border-color: #52616e;
        background: #252d35;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TACTA</h1>
      <p>Varsinaisen pelin runko on aloitettu. Korttirakenne-editori on siirretty omaan hakemistoonsa.</p>
      <nav aria-label="Projektin näkymät">
        <a href="./game/">Avaa peli</a>
        <a href="./editor/">Avaa korttieditori</a>
      </nav>
    </main>
  </body>
</html>
